<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendora - Nueva Contraseña</title>
    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f3f4;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h2 {
            color: #5c242a;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #7a3038;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #7a3038;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        #mensaje-alerta {
            margin-top: 15px;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .alert-success {
            background-color: #e6f4ea;
            color: #137333;
        }

        .alert-error {
            background-color: #fce8e6;
            color: #c5221f;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="/static/images/logo.png" alt="Vendora Logo" class="logo-img">
        
        <h2>Nueva Contraseña</h2>
        <p>Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta.</p>

        <form id="reset-password-form" onsubmit="actualizarPassword(event)">
            <div class="input-group">
                <label for="new-password">Nueva contraseña</label>
                <input type="password" id="new-password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">Actualizar contraseña</button>
        </form>

        <div id="mensaje-alerta"></div>
    </div>

    <script>
        // Obtenemos el token de la URL automáticamente (ej: ?token=xyz)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function actualizarPassword(event) {
            event.preventDefault();
            const passwordInput = document.getElementById('new-password');
            const btnSubmit = document.getElementById('btn-submit');
            const alerta = document.getElementById('mensaje-alerta');
            
            const nuevaPassword = passwordInput.value.trim();
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Actualizando...";
            alerta.style.display = "none";

            try {
                const response = await fetch('/auth/actualizar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, nueva_password: nuevaPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    alerta.textContent = "¡Contraseña actualizada con éxito! Redirigiendo al login...";
                    alerta.className = "alert-success";
                    alerta.style.display = "block";
                    
                    // Redirige al login después de 2 segundos
                    setTimeout(() => {
                        window.location.href = "/auth/login";
                    }, 2000);
                } else {
                    alerta.textContent = data.detail || "El enlace es inválido o ha expirado.";
                    alerta.className = "alert-error";
                    alerta.style.display = "block";
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Actualizar contraseña";
                }
            } catch (error) {
                console.error('Error:', error);
                alerta.textContent = "Ocurrió un error al conectar con el servidor.";
                alerta.className = "alert-error";
                alerta.style.display = "block";
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Actualizar contraseña";
            }
        }
    </script>
</body>
</html>
