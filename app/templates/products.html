<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/css/crud.css">
</head>
<body>
  <main class="crud-page">
  <h1>Productos</h1>
  <div id="page-error" class="page-error" role="alert" hidden></div>

  <form id="product-form">
    <label>Código <input type="text" id="product-code" required></label>
    <label>Nombre <input type="text" id="product-name" required></label>
    <label>Precio <input type="number" id="product-price" min="0.01" step="0.01" required></label>
    <label>IVA <input type="number" id="product-tax" min="0" max="1" step="0.0001" required></label>
    <label>Categoría <input type="number" id="product-category-id" min="1"></label>
    <button type="submit">Guardar producto</button>
  </form>

  <table>
    <thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Precio</th><th>IVA</th></tr></thead>
    <tbody id="products-body"></tbody>
  </table>
  </main>

  <script src="/static/js/products.js"></script>
</body>
</html>
