<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="/static/css/crud.css">
  </head>
  <body>
    <main class="crud-page">
      <h1 data-i18n="products.title">Productos</h1>
      <a href="/dashboard" data-i18n="products.back">Volver al panel</a>
      <button type="button" data-lang-toggle>EN</button>

      <p id="page-success" role="status" hidden></p>
      <p id="page-error" class="page-error" role="alert" hidden></p>

      <form id="product-form">
        <input id="product-id" type="hidden">

        <label for="product-branch-id">
          Sucursal
        </label>
        <select id="product-branch-id" required></select>

        <label for="product-category-id">
          Categoría
        </label>
        <select id="product-category-id">
          <option value="">Sin categoría</option>
        </select>

        <label for="product-code">
          Código
        </label>

        <input id="product-code" type="text" required>

        <label for="product-name">
          Nombre
        </label>
        <input id="product-name" type="text" required>

        <label for="product-price">
          Precio
        </label>
        <input id="product-price" type="number" min="0.01" step="0.01" required>

        <label for="product-tax">
          IVA
        </label>
        <input id="product-tax" type="number" min="0" max="1" step="0.0001" value="0.16" required>

        <button type="submit" id="product-submit">
          Guardar producto
        </button>
        
        <button type="button" id="product-cancel" hidden>
          Cancelar edición
        </button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Sucursal</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>IVA</th>
            <th>Acciones</th>
          </tr> </thead> <tbody id="products-body"></tbody>
        </table>
    </main>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/products.js"></script>
  </body>
</html>
