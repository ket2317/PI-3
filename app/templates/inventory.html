<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario</title>
  <link rel="stylesheet" href="/static/css/crud.css">
</head>
<body>
  <main class="crud-page">
    <h1>Inventario</h1>
    <a href="/dashboard">Volver al panel</a>

    <p id="page-success" role="status" hidden></p>
    <p id="page-error" class="page-error" role="alert" hidden></p>

    <label for="inventory-branch-id">Sucursal</label>
    <select id="inventory-branch-id"></select>

    <form id="inventory-form">
      <input id="inventory-product-id" type="hidden">

      <label for="inventory-search">Buscar producto por código o nombre</label>
      <input id="inventory-search" type="text" placeholder="Ej. 34346 o awa" autocomplete="off">

      <label for="inventory-product-select">Producto</label>
      <select id="inventory-product-select" required></select>

      <label for="inventory-quantity">Existencia</label>
      <input id="inventory-quantity" type="number" min="0" required>

      <label for="inventory-minimum">Stock mínimo</label>
      <input id="inventory-minimum" type="number" min="0" value="5" required>

      <button type="submit">Actualizar inventario</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Producto</th>
          <th>Existencia</th>
          <th>Stock mínimo</th>
        </tr>
      </thead>
      <tbody id="inventory-body"></tbody>
    </table>

    <button type="button" id="low-stock-button">Ver productos con bajo inventario</button>

    <table id="low-stock-table" hidden>
      <thead>
        <tr>
          <th>Código</th>
          <th>Producto</th>
          <th>Existencia</th>
          <th>Stock mínimo</th>
        </tr>
      </thead>
      <tbody id="low-stock-body"></tbody>
    </table>

  </main>

  <script src="/static/js/inventory.js"></script>
</body>
</html>
