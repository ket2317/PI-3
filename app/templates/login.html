<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema POS</title>

    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

    <main class="login-wrapper">
        <div class="login-container">

            <!-- RECUADRO IZQUIERDO -->
            <div class="info-box">
                <div class="info-content">

                    <h1 class="system-title">Sistema POS</h1>

                    <div class="session-label">
                        <h2>Inicio de Sesión</h2>

                        <span class="security-badge">
                            <svg width="16" height="16"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <rect x="3" y="11"
                                      width="18"
                                      height="11"
                                      rx="2"
                                      ry="2"/>

                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>

                            Acceso Seguro Multi-Sede
                        </span>
                    </div>

                </div>
            </div>


            <!-- RECUADRO DERECHO -->
            <div class="form-box">

                <form id="login-form" class="login-form">

                    <!-- CORREO -->
                    <div class="input-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg width="20"
                                     height="20"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2">

                                    <rect width="20"
                                          height="16"
                                          x="2"
                                          y="4"
                                          rx="2"/>

                                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                                </svg>
                            </span>

                            <input
                                type="email"
                                id="email"
                                autocomplete="username"
                                placeholder="usuario@correo.com"
                                required
                            >

                        </div>
                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="input-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg width="20"
                                     height="20"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="2">

                                    <rect width="18"
                                          height="11"
                                          x="3"
                                          y="11"
                                          rx="2"
                                          ry="2"/>

                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="password"
                                autocomplete="current-password"
                                placeholder="••••••••"
                                required
                            >

                        </div>
                    </div>


                    <!-- MENSAJE DE ERROR DEL LOGIN -->
                    <p id="login-error" role="alert" hidden></p>


                    <!-- BOTÓN -->
                    <button
                        id="login-button"
                        type="submit"
                        class="btn-submit"
                    >
                        <span>Iniciar Sesión</span>

                        <svg width="20"
                             height="20"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <path d="M5 12h14"/>
                            <path d="m12 5 7 7-7 7"/>
                        </svg>

                    </button>

                </form>

            </div>

        </div>
    </main>


    <!-- FUNCIONALIDAD DEL LOGIN -->
    <script src="/static/js/auth.js"></script>

</body>
</html>
