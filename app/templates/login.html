<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        const savedTheme = localStorage.getItem("colorMode") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Vendora</title>

    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>

<body>

    <main class="login-wrapper">
        <div class="login-container">

            <!-- RECUADRO IZQUIERDO (imagen)-->
            <div class="info-box">
                <div class="info-header">
                    <div class="brand-group">
                        <img src="/static/images/logo.png" alt="Logo Vendora" style="width: 40px; height: 40px; border-radius: 8px;">
                        <div class="logo-vendora">VENDORA</div>
                    </div>

                    <a href="/" class="btn-volver">Volver &rarr;</a>
                </div>

                <div class="info-footer">
                    <h2>Conecta tus sucursales,<br>agiliza tus ventas.</h2>
                    <div class="carousel-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>


            <!-- RECUADRO DERECHO -->
            <div class="form-box">
                <div class="form-header">
                    <h1>Iniciar Sesión</h1>
                    <p>¿No tienes una cuenta? <a href="#">Contáctanos</a></p>
                </div>

                <form id="login-form" class="login-form" autocomplete="off">

                    <!-- CORREO -->
                    <div class="input-container">
                        <label for="email"> Correo electrónico </label>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="input-container">
                        <label for="password"> Contraseña </label>
                        <div class="password-wrapper">
                                <input type="password" id="password" placeholder="••••••••" required>
                            <span class="toggle-password" title="Mostrar/Ocultar contraseña">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- enlace de recuperacion de contraseña -->
                    <div class="forgot-password-link">
                        <a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>



                    <!-- terminos y condiciones -->



                    <!-- MENSAJE DE ERROR DEL LOGIN -->
                    <p id="login-error" role="alert" hidden></p>

                    <!-- BOTÓN -->
                    <button id="login-button" type="submit" class="btn-submit">
                        Iniciar Sesión
                    </button>

                    <p class="privacy-note">
                        Al iniciar sesión aceptas el
                        <a href="/aviso-de-privacidad">Aviso de Privacidad y Políticas de Uso</a>.
                    </p>

                </form>

            </div>

        </div>
    </main>


    <!-- FUNCIONALIDAD DEL LOGIN -->
    <script src="/static/js/auth.js"></script>
    

<script>
    document.getElementById('forgot-link').addEventListener('click', function (e) {
        e.preventDefault();

        const box = document.querySelector('.login-container');

        if (!box || box.dataset.animating === "true") return;

        box.dataset.animating = "true";

        // Forzamos que el navegador aplique el estado inicial
        box.style.transition = "none";
        box.style.transform = "scale(1)";
        box.style.opacity = "1";

        box.offsetHeight;

        // Animación lenta y visible
        box.style.transition =
            "transform 2s ease-in-out, opacity 2s ease-in-out";

        requestAnimationFrame(() => {
            box.style.transform = "scale(0.65)";
            box.style.opacity = "0";
        });

        // Navegamos cuando termine la animación
        setTimeout(() => {
            window.location.href = "/auth/forgot-password";
        }, 2100);
    });
</script>



    

</body>
</html>
