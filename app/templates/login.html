<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> login pos </title>
    <link rel="stylesheet" href="/static/css/login.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-card">

        <div class="left-panel" style="background-image: url('/static/img/background.jpg');">
            <div class="overlay"></div>
            
            <div class="left-header">
                <div class="brand-logo">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
                    </svg>
                </div>
                <div class="brand-info">
                    <span class="brand-name">PUNTO DE VENTA</span>
                    <span class="brand-tagline">SISTEMA POS</span>
                </div>
            </div>

            <div class="left-body">
                <h1>Bienvenido/a <br> al <span class="project-title-highlight">Punto de Venta</span></h1>
                <p>Inicia sesión para gestionar tus ventas e inventario</p>
            </div>

            <div class="left-footer-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
                <div>
                    <strong>Seguro y confiable</strong>
                    <small>Protegemos tu información</small>
                </div>
            </div>
        </div>

        
        <div class="right-panel">
            <div class="login-container">
                <h1>Punto de Venta</h1>
                
                <form>
                    <div class="input-group">
                        <label for="email">Correo</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Correo@email.com"
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Contraseña"
                        >
                    </div>

                    <button type="submit">
                        Iniciar sesion
                    </button>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
