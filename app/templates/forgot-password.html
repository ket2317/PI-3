<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendora - Recuperar Contraseña</title>
    <!-- Fuente Inter igual que el login -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f3f4;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h2 {
            color: #5c242a;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #7a3038;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #7a3038;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #7a3038;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #mensaje-alerta {
            margin-top: 15px;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .alert-success {
            background-color: #e6f4ea;
            color: #137333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="/static/images/logo.png" alt="Vendora Logo" class="logo-img">
        
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Ingresa tu correo electrónico registrado y te enviaremos las instrucciones.</p>

        <form id="reset-form" onsubmit="enviarRecuperacion(event)">
            <div class="input-group">
                <label for="reset-email">Correo electrónico</label>
                <input type="email" id="reset-email" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" id="btn-enviar" class="btn-submit">Enviar enlace</button>
        </form>

        <div id="mensaje-alerta"></div>

        <a href="/login" class="back-link">&larr; Volver al inicio de sesión</a>
    </div>

    <script>
        async function enviarRecuperacion(event) {
            event.preventDefault();
            const emailInput = document.getElementById('reset-email');
            const btnEnviar = document.getElementById('btn-enviar');
            const alerta = document.getElementById('mensaje-alerta');
            
            const email = emailInput.value.trim();
            btnEnviar.disabled = true;
            btnEnviar.textContent = "Enviando...";
            alerta.style.display = "none";

            try {
                const response = await fetch('/auth/recuperar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || data.message || "No se pudo enviar el correo.");
                }
                
                alerta.textContent = data.message || "Proceso completado.";
                alerta.className = "alert-success";
                alerta.style.display = "block";
                emailInput.value = "";
            } catch (error) {
                alerta.textContent = error.message || "Ocurrió un error al enviar el correo.";
                alerta.className = "";
                alerta.style.display = "block";
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = "Enviar enlace";
            }
        }
    </script>
</body>
</html>
