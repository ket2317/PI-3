<header class="app-topbar">
  <div class="app-topbar-title">
    <h1 data-i18n="{{ page_title_key }}">{{ page_title }}</h1>
    {% if page_subtitle %}<p data-i18n="{{ page_subtitle_key }}">{{ page_subtitle }}</p>{% endif %}
  </div>
  <div class="app-topbar-actions">
    <label class="app-search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" data-i18n-placeholder="topbar.search" placeholder="Buscar..." disabled>
    </label>
    <button type="button" class="icon-button lang-toggle" data-lang-toggle aria-label="Cambiar idioma"></button>
    <button type="button" class="icon-button" data-theme-toggle aria-label="Cambiar tema"></button>
  </div>
</header>
