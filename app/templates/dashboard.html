<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel principal</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <nav>
    <strong>Punto de Venta</strong>

    <a class="admin-only" href="/sucursales-ui">
      Sucursales
    </a>

    <a class="authenticated" href="/productos-ui">
      Productos
    </a>

    <a class="admin-manager" href="/inventario-ui">
      Inventario
    </a>

    <a class="authenticated" href="/ventas-ui">
      Ventas
    </a>

    <a class="admin-manager" href="/usuarios-ui">
      Usuarios
    </a>

    <a class="admin-manager" href="/reportes-ui">
      Reportes
    </a>

    <button id="logout-button" type="button">
      Cerrar sesión
    </button>
  </nav>

  <main>
    <h1>Panel principal</h1>

    <section class="user-context">
      <h2>Sesión actual</h2>
      <p id="current-user">Cargando usuario...</p>
      <p id="current-role"></p>
      <p id="current-branch"></p>
    </section>

    <p id="dashboard-error" role="alert" hidden></p>
  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
