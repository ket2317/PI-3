<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel principal</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <nav>
    <strong>Punto de Venta</strong>
    
    <a class="admin-only" href="/sucursales-ui" data-i18n="nav.branches">
      Sucursales
    </a>

    <a class="authenticated" href="/productos-ui" data-i18n="nav.products">
      Productos
    </a>
    
    <a class="admin-manager" href="/inventario-ui" data-i18n="nav.inventory">
      Inventario
    </a>
    
    <a class="authenticated" href="/ventas-ui" data-i18n="nav.sales">
       Ventas
    </a>
    
    <a class="admin-manager" href="/usuarios-ui" data-i18n="nav.users">
      Usuarios
    </a>
    
    <a class="admin-manager" href="/reportes-ui" data-i18n="nav.reports">
      Reportes
    </a>

    <button id="logout-button" type="button" data-i18n="nav.logout">
      Cerrar sesión
    </button>
    <button type="button" data-lang-toggle>EN</button>
  </nav>

  <main>
    <h1>Panel principal</h1>

    <section class="user-context">
      <section class="user-context" id="my-branch-section" hidden>
       <h2>Mi sucursal</h2>
       <p id="branch-name"></p>
       <p id="branch-address"></p>
       <p id="branch-phone"></p>
       <p id="branch-contact"></p>
     </section>
      <h2>Sesión actual</h2>
      <p id="current-user">Cargando usuario...</p>
      <p id="current-role"></p>
      <p id="current-branch"></p>
    </section>

    <p id="dashboard-error" role="alert" hidden></p>
  </main>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
