services:
  - type: web
    name: pi-net
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.seed_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pi-net-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador General
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: pi-net-db
    plan: free
    region: oregon
